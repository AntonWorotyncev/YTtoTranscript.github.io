<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to YT to Transcript</title>
    <link rel="icon" type="image/png" sizes="48x48" href="48.png" />
    <link rel="apple-touch-icon" href="48.png" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="cd2374e0-b4e2-4357-a2de-7f5a775c2acc"></script>
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <div class="page-controls">
      <button
        type="button"
        id="welcome_theme_toggle"
        class="theme-toggle"
        data-i18n-aria="themeNightAria"
        aria-label="Switch to night mode"
        title="Night mode"
      >
        <svg class="theme-toggle__icon theme-toggle__icon_moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon_sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 3V5M12 19V21M5 12H3M21 12H19M6.34 6.34L4.93 4.93M19.07 19.07L17.66 17.66M17.66 6.34L19.07 4.93M4.93 19.07L6.34 17.66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <label class="language-switch" for="welcome_language_select">
        <span data-i18n="languageLabel">Language</span>
        <select id="welcome_language_select" aria-label="Language"></select>
      </label>
    </div>

    <main class="page">

      <section class="hero">
        <header class="top">
          <div class="brand">
            <div class="brand-icon-wrap">
              <img class="brand-icon" src="48.png" alt="" width="48" height="48" />
            </div>
            <div>
              <p class="badge" data-i18n="badge">Installed successfully</p>
              <h1 class="brand-title">
                <span class="brand-title__text">
                  <span class="brand-title__yt" data-i18n="brandYouTube">YT</span><span class="brand-title__sep" data-i18n="brandTo"> to </span><span class="brand-title__name" data-i18n="brandTranscript">Transcript</span>
                </span>
              </h1>
            </div>
          </div>
        </header>

        <p class="intro" data-i18n="heroDescription">
          Get transcripts and AI summaries on any YouTube video.
        </p>
      </section>

      <section class="welcome-offer">
        <a
          class="button button_large"
          href="https://www.youtube.com/watch?v=YRvf00NooN8&t=3013s"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span data-i18n="tryButton">Try it</span>
        </a>
      </section>

      <section class="onboarding">
        <ol class="onboarding-steps">
          <li class="onboard-step step-card">
            <div class="step-head">
              <span class="step-num" aria-hidden="true">1</span>
              <div class="step-copy">
                <h3 data-i18n="step2Title">Open any YouTube video</h3>
                <p data-i18n="step2Text">The panel appears on the right, under the video description area.</p>
              </div>
            </div>
            <figure class="step-figure step-figure_youtube">
              <div class="step-figure-overlay">
                <img
                  src="welcome-youtube.png"
                  alt="Extension panel on a YouTube video page"
                  data-i18n-alt="guidePanelAlt"
                  loading="lazy"
                />
                <div class="video-clickbait" aria-hidden="true">
                  <span class="video-clickbait__arrow">➜</span>
                </div>
                <div class="plugin-highlight" aria-hidden="true"></div>
              </div>
              <figcaption data-i18n="guidePanelCaption">Click the bar to open Transcript · Summary</figcaption>
            </figure>
          </li>
        </ol>
      </section>
    </main>
    <script type="module" src="welcome.js"></script>
  </body>
</html>
